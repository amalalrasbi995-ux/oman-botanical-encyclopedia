<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>موسوعة النباتات العمانية</title>
<link rel="preload" href="modles/frankincense.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:Arial,sans-serif}#wrap{height:100%;display:flex;align-items:center;justify-content:center}#stage{position:relative;width:min(100vw,calc(100vh*1.778));aspect-ratio:16/9;overflow:hidden;background:#1d3025}.page{position:absolute;inset:0;display:none}.page.active{display:block}.bg{width:100%;height:100%;object-fit:fill;display:block}.hit{position:absolute;border:0;background:transparent;cursor:pointer;z-index:20}#viewer{position:absolute;left:4.2%;top:10%;width:48%;height:70%;z-index:10}model-viewer{width:100%;height:100%;background:transparent;--poster-color:transparent}#load{position:absolute;left:15%;top:42%;z-index:11;color:#fff;background:#183024cc;border:1px solid #c8a66a;padding:9px 13px;border-radius:12px}#hint{position:absolute;left:13%;bottom:18%;z-index:12;color:#fff;background:#183024bb;border:1px solid #c8a66a;padding:6px 12px;border-radius:999px;font-size:clamp(10px,.9vw,15px);pointer-events:none}#celebrate{position:absolute;inset:0;pointer-events:none;z-index:35;overflow:hidden}.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#d9b66f;opacity:0;animation:spark 1.25s ease-out forwards}@keyframes spark{0%{opacity:0;transform:translateY(18px) scale(.2)}20%{opacity:.95}100%{opacity:0;transform:translateY(-115px) scale(1.1)}}</style></head><body><div id="wrap"><main id="stage"><div id="celebrate"></div>
<section id="p1" class="page active"><img class="bg" src="01_HOME.webp"><button class="hit" data-go="p2" style="left:35.4%;top:82%;width:29.2%;height:11.8%"></button></section>
<section id="p2" class="page"><img class="bg" src="02_FAMILY_SELECT.webp"><button class="hit" data-go="p3" style="left:27%;top:24.5%;width:19.5%;height:49.5%"></button></section>
<section id="p3" class="page"><img class="bg" src="03_BURSERACEAE_INFO.webp"><button class="hit" data-go="p4" style="left:60%;top:72%;width:22.8%;height:8%"></button></section>
<section id="p4" class="page"><img class="bg" src="04_PLANT_SELECT.webp"><button class="hit" data-go="p5" style="left:12.7%;top:23%;width:14.8%;height:48.5%"></button></section>
<section id="p5" class="page"><img class="bg" src="05_FRANKINCENSE.webp"><div id="viewer"><model-viewer id="plant3d" src="modles/frankincense.glb" loading="eager" reveal="auto" camera-controls touch-action="pan-y" interaction-prompt="none" shadow-intensity="0.7" exposure="1.15" camera-orbit="0deg 78deg 105%" min-camera-orbit="auto auto 55%" max-camera-orbit="auto auto 180%" field-of-view="30deg"></model-viewer></div><div id="load">جارٍ تجهيز النبات…</div><div id="hint">↻ اسحب النبات لتدويره • استخدم العجلة للتقريب</div></section><audio id="voice" preload="auto" src="welcome.mp3"></audio></main></div>
<script>const pages=[...document.querySelectorAll('.page')],voice=document.getElementById('voice'),mv=document.getElementById('plant3d'),load=document.getElementById('load');let ac,celebrated=false;function ctx(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}function tone(f=620,d=.1,v=.025,delay=0){const a=ctx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}function clickSfx(){tone(540,.055,.018);tone(810,.07,.012,.035)}function success(){tone(523,.2,.024);tone(659,.22,.024,.08);tone(784,.3,.027,.16)}function sparkle(){const b=document.getElementById('celebrate');for(let i=0;i<22;i++){const s=document.createElement('i');s.className='spark';s.style.left=(8+Math.random()*43)+'%';s.style.top=(48+Math.random()*28)+'%';s.style.animationDelay=Math.random()*.2+'s';b.appendChild(s);setTimeout(()=>s.remove(),1500)}}function go(id){clickSfx();pages.forEach(p=>p.classList.toggle('active',p.id===id));if(id==='p2'){voice.currentTime=0;voice.play().catch(()=>{})}else{voice.pause();voice.currentTime=0}}document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));mv.addEventListener('progress',e=>{const p=Math.round((e.detail.totalProgress||0)*100);load.textContent='جارٍ تجهيز النبات… '+p+'%'});mv.addEventListener('load',()=>{load.style.display='none';if(!celebrated){celebrated=true;success();sparkle()}});mv.addEventListener('error',e=>{load.textContent='تعذر تحميل النموذج';console.error('model-viewer error',e)});window.addEventListener('load',()=>{fetch('modles/frankincense.glb',{cache:'force-cache'}).catch(()=>{})});</script></body></html>
