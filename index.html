<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>موسوعة النباتات العمانية</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}</script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:Arial,sans-serif}#wrap{height:100%;display:flex;align-items:center;justify-content:center}#stage{position:relative;width:min(100vw,calc(100vh*1.778));aspect-ratio:16/9;overflow:hidden;background:#1d3025}.page{position:absolute;inset:0;display:none}.page.active{display:block}.bg{width:100%;height:100%;object-fit:fill;display:block}.hit{position:absolute;border:0;background:transparent;cursor:pointer;z-index:20}#viewer{position:absolute;left:4.2%;top:4%;width:48%;height:70%;z-index:10;touch-action:none;cursor:grab}#viewer canvas{width:100%;height:100%;display:block}#load{position:absolute;left:15%;top:42%;z-index:11;color:#fff;background:#183024cc;border:1px solid #c8a66a;padding:9px 13px;border-radius:12px}#hint{position:absolute;left:13%;bottom:18%;z-index:12;color:#fff;background:#183024bb;border:1px solid #c8a66a;padding:6px 12px;border-radius:999px;font-size:clamp(10px,.9vw,15px);pointer-events:none}#celebrate{position:absolute;inset:0;pointer-events:none;z-index:35;overflow:hidden}.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#d9b66f;opacity:0;animation:spark 1.25s ease-out forwards}@keyframes spark{0%{opacity:0;transform:translateY(18px) scale(.2)}20%{opacity:.95}100%{opacity:0;transform:translateY(-115px) scale(1.1)}}</style></head><body><div id="wrap"><main id="stage"><div id="celebrate"></div>
<section id="p1" class="page active"><img class="bg" src="01_HOME.webp"><button class="hit" data-go="p2" style="left:35.4%;top:82%;width:29.2%;height:11.8%"></button></section>
<section id="p2" class="page"><img class="bg" src="02_FAMILY_SELECT.webp"><button class="hit" data-go="p3" style="left:27%;top:24.5%;width:19.5%;height:49.5%"></button></section>
<section id="p3" class="page"><img class="bg" src="03_BURSERACEAE_INFO.webp"><button class="hit" data-go="p4" style="left:60%;top:72%;width:22.8%;height:8%"></button></section>
<section id="p4" class="page"><img class="bg" src="04_PLANT_SELECT.webp"><button class="hit" data-go="p5" style="left:12.7%;top:23%;width:14.8%;height:48.5%"></button></section>
<section id="p5" class="page"><img class="bg" src="05_FRANKINCENSE.webp"><div id="viewer"><canvas id="c"></canvas></div><div id="load">جارٍ تحميل النبات ثلاثي الأبعاد…</div><div id="hint">↻ اسحب النبات لتدويره • استخدم العجلة للتقريب</div></section><audio id="voice" preload="none" src="welcome.mp3"></audio></main></div>
<script type="module">const pages=[...document.querySelectorAll('.page')],voice=document.getElementById('voice');let ac;function ctx(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}function tone(f=620,d=.1,v=.025,delay=0){const a=ctx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}function clickSfx(){tone(540,.055,.018);tone(810,.07,.012,.035)}function success(){tone(523,.2,.024);tone(659,.22,.024,.08);tone(784,.3,.027,.16)}function sparkle(){const b=document.getElementById('celebrate');for(let i=0;i<22;i++){const s=document.createElement('i');s.className='spark';s.style.left=(8+Math.random()*43)+'%';s.style.top=(48+Math.random()*28)+'%';s.style.animationDelay=Math.random()*.2+'s';b.appendChild(s);setTimeout(()=>s.remove(),1500)}}function go(id){clickSfx();pages.forEach(p=>p.classList.toggle('active',p.id===id));if(id==='p2'){voice.currentTime=0;voice.play().catch(()=>{})}else{voice.pause();voice.currentTime=0}if(id==='p5'){init3d();setTimeout(()=>{success();sparkle()},500)}}document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));let started=false;async function init3d(){if(started)return;started=true;const load=document.getElementById('load'),box=document.getElementById('viewer'),canvas=document.getElementById('c');try{const THREE=await import('three');const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');const r=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=THREE.SRGBColorSpace;const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,1,.01,1000);cam.position.set(0,1.3,5);s.add(new THREE.HemisphereLight(0xffffff,0x665544,2.2));const dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(4,7,5);s.add(dl);const root=new THREE.Group();s.add(root);new GLTFLoader().load('models/frankincense.glb',g=>{const o=g.scene;root.add(o);let b=new THREE.Box3().setFromObject(o),sz=b.getSize(new THREE.Vector3()),ct=b.getCenter(new THREE.Vector3());o.position.sub(ct);o.scale.setScalar(3.65/Math.max(sz.x,sz.y,sz.z));let b2=new THREE.Box3().setFromObject(o);o.position.y-=b2.min.y+.72;root.position.y=.68;load.style.display='none'},undefined,e=>{load.textContent='تعذر تحميل النموذج';console.error(e)});let ry=0,rx=0,z=5,drag=false,x=0,y=0;box.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;box.setPointerCapture(e.pointerId)};box.onpointermove=e=>{if(!drag)return;ry+=(e.clientX-x)*.01;rx=Math.max(-.25,Math.min(.25,rx+(e.clientY-y)*.004));x=e.clientX;y=e.clientY};box.onpointerup=()=>drag=false;box.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(3.2,Math.min(7,z+e.deltaY*.003))},{passive:false});function resize(){let q=box.getBoundingClientRect();r.setSize(q.width,q.height,false);cam.aspect=q.width/q.height;cam.updateProjectionMatrix()}new ResizeObserver(resize).observe(box);resize();(function loop(){root.rotation.y=ry;root.rotation.x=rx;cam.position.z=z;r.render(s,cam);requestAnimationFrame(loop)})()}catch(e){load.textContent='تعذر تشغيل العرض ثلاثي الأبعاد';console.error(e)}}</script></body></html>
